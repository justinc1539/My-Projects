<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Screen Background Image</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /*overflow: hidden;*/   /* prevents scrolling */
        }
        .bg-image {
            position: fixed;
            inset: 0;              /* top:0; right:0; bottom:0; left:0 */
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;          /* slightly transparent */
            pointer-events: none;  /* clicks pass through */
            z-index: 999999999999;
        }
    </style>
</head>
<body>
    <img
        class="bg-image"
        src="https://media1.tenor.com/m/-pPezftYe2MAAAAd/cinnabon-cinnamon-roll.gif"
        alt="Made by Justin Chua"
    >
</body>
</html>
